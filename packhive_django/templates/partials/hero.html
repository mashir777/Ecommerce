{% load static %}
<section class="container-site py-8 md:py-9">
  <div id="hero-row" class="flex flex-col md:flex-row items-stretch gap-2.5 md:h-[520px]">
    {% for slide in hero_slides %}
      <div class="hero-panel group {% if forloop.first %}active{% endif %}" data-hero-index="{{ forloop.counter0 }}" role="button" tabindex="0" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}">
        <img src="{% static slide.image %}" alt="{{ slide.title }}" class="absolute inset-0 h-full w-full object-cover {% if forloop.first %}scale-100{% else %}group-hover:scale-105{% endif %} transition-transform duration-500" />
        <div class="absolute inset-0 {% if forloop.first %}hero-overlay-active{% else %}hero-overlay-idle{% endif %} hero-overlay"></div>

        <span class="hero-label absolute inset-0 z-10 {% if forloop.first %}hidden{% else %}flex{% endif %} items-center justify-center pointer-events-none">
          <span class="text-white font-semibold tracking-wide text-sm md:text-[15px] md:vertical-label drop-shadow">{{ slide.short_label }}</span>
        </span>

        <div class="hero-content relative z-10 h-full {% if forloop.first %}flex{% else %}hidden{% endif %} flex-col justify-center px-7 sm:px-10 lg:px-12 py-10 max-w-xl animate-fade-up">
          <p class="text-white/85 text-[12px] sm:text-[13px] font-semibold tracking-[0.16em] mb-3 uppercase">{{ slide.eyebrow }}</p>
          <h1 class="text-white text-[1.85rem] sm:text-[2.4rem] lg:text-[2.65rem] font-bold leading-[1.12]">{{ slide.title }}</h1>
          <p class="mt-4 text-white/90 text-[15px] leading-relaxed max-w-md">{{ slide.text }}</p>
          <div class="mt-7 flex flex-wrap gap-3">
            <a href="{{ slide.primary.href }}" class="btn-primary">{{ slide.primary.label }}</a>
            <a href="{{ slide.secondary.href }}" class="btn-ghost">{{ slide.secondary.label }}</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</section>
<script>
  (function () {
    const panels = Array.from(document.querySelectorAll('.hero-panel'));
    function activate(index) {
      panels.forEach((panel, i) => {
        const active = i === index;
        panel.classList.toggle('active', active);
        panel.setAttribute('aria-expanded', active ? 'true' : 'false');
        panel.querySelector('.hero-overlay')?.classList.toggle('hero-overlay-active', active);
        panel.querySelector('.hero-overlay')?.classList.toggle('hero-overlay-idle', !active);
        panel.querySelector('.hero-label')?.classList.toggle('hidden', active);
        panel.querySelector('.hero-label')?.classList.toggle('flex', !active);
        const content = panel.querySelector('.hero-content');
        if (content) {
          content.classList.toggle('hidden', !active);
          content.classList.toggle('flex', active);
        }
      });
    }
    panels.forEach((panel, i) => {
      panel.addEventListener('click', () => activate(i));
      panel.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate(i);
        }
      });
    });
  })();
</script>
