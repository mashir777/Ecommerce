{% load static %}
<section class="container-site py-10 md:py-14">
  <h2 class="section-title">Browse Our Collection</h2>
  <img src="{% static 'heading-ornament.png' %}" alt="" width="140" height="14" class="section-ornament" />

  <div class="relative mt-10">
    <button type="button" id="cat-prev" aria-label="Previous" class="absolute left-0 top-1/2 -translate-y-1/2 z-10 h-10 w-10 rounded-full bg-white/90 border border-[var(--line)] shadow-sm hidden sm:flex items-center justify-center text-[var(--ink)]">‹</button>
    <button type="button" id="cat-next" aria-label="Next" class="absolute right-0 top-1/2 -translate-y-1/2 z-10 h-10 w-10 rounded-full bg-white/90 border border-[var(--line)] shadow-sm hidden sm:flex items-center justify-center text-[var(--ink)]">›</button>

    <div id="cat-scroller" class="flex gap-5 overflow-x-auto px-1 py-2 scroll-smooth" style="scrollbar-width:none">
      {% for cat in categories %}
        <a href="{% url 'shop' %}?cat={{ cat.slug }}" class="group shrink-0 w-[140px] sm:w-[150px] text-center">
          <div class="relative mx-auto h-[140px] w-[140px] sm:h-[150px] sm:w-[150px] rounded-full overflow-hidden border border-[var(--line)] bg-[var(--cream)] shadow-sm">
            {% if cat.image_url %}<img src="{{ cat.image_url }}" alt="{{ cat.name }}" class="absolute inset-0 h-full w-full object-cover transition-transform duration-400 group-hover:scale-105" />{% endif %}
          </div>
          <h3 class="mt-3 text-[13px] sm:text-sm font-semibold text-[var(--ink)] leading-snug">{{ cat.name }}</h3>
        </a>
      {% endfor %}
    </div>
  </div>
</section>
<script>
  const scroller = document.getElementById('cat-scroller');
  document.getElementById('cat-prev')?.addEventListener('click', () => scroller?.scrollBy({ left: -280, behavior: 'smooth' }));
  document.getElementById('cat-next')?.addEventListener('click', () => scroller?.scrollBy({ left: 280, behavior: 'smooth' }));
</script>
